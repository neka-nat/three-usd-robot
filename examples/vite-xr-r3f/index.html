<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>three-usd-robot — XR (React Three Fiber)</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #202024;
        font-family: system-ui, sans-serif;
        color: #e6e6e6;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: 320px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(24, 24, 28, 0.88);
        font-size: 12px;
        line-height: 1.5;
        backdrop-filter: blur(4px);
        z-index: 5;
      }
      #panel select {
        width: 100%;
        margin: 4px 0 6px;
      }
      #panel .mono {
        font-family: ui-monospace, monospace;
        font-size: 11px;
        color: #a8d0a8;
        white-space: pre-wrap;
      }
      #VRButton {
        position: fixed;
        bottom: 20px;
        left: calc(50% - 60px);
        width: 120px;
        padding: 10px;
        border: 1px solid #fff;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.3);
        color: #fff;
        font-size: 13px;
        cursor: pointer;
        z-index: 10;
      }
      #hint {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: #aaa;
        font-size: 12px;
        max-width: 70vw;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
