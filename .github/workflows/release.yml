name: Release

# Publishes to npm when a version tag is pushed, e.g.:
#   npm version patch        # bumps package.json + creates the tag
#   git push --follow-tags
#
# Authentication uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# Configure it once at npmjs.com → package → Settings → Trusted publisher:
#   Publisher: GitHub Actions
#   Organization / repository: neka-nat / three-usd-robot
#   Workflow filename: release.yml
#   Environment: (leave empty — this job does not use one)
# Requires `id-token: write` below and npm >= 11.5.1 (installed in the job;
# pinned to npm 11 because npm 12 needs Node >= 22.22 and this job runs Node 20).
# Provenance attestations are generated automatically for trusted publishing,
# so no `--provenance` flag is needed.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # trusted publishing + provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Update npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
